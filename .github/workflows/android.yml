name: Bygg Android-appen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installera Capacitor
        working-directory: app
        run: npm ci

      - name: Kopiera webbappen in i Android-projektet
        working-directory: app
        run: |
          npm run kopiera
          npx cap sync android

      - name: Bygg APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Döp om filen
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk fitchi.apk

      - name: Publicera som "Fitchi Android (senaste)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: senaste
          name: Fitchi Android (senaste)
          body: |
            Senaste testversionen av Fitchi för Android. Ladda ner **fitchi.apk** på telefonen och installera.
            Byggd från ${{ github.sha }}.
          files: fitchi.apk
          make_latest: true
