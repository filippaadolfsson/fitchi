name: Bygg Android-appen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bygg:
    runs-on: ubuntu-latest
    env:
      HAR_NYCKEL: ${{ secrets.FITCHI_KEYSTORE_B64 != '' && 'ja' || 'nej' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installera Capacitor
        working-directory: app
        run: npm ci

      - name: Kopiera webbappen in i Android-projektet
        working-directory: app
        run: |
          npm run kopiera
          npx cap sync android

      - name: Bygg APK
        working-directory: app/android
        env:
          FITCHI_VERSION_CODE: ${{ github.run_number }}
          FITCHI_VERSION_NAME: 0.9.${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../../bygg.log

      - name: Spara bygglogg om något gick fel
        if: failure()
        run: |
          git config user.name "fitchi-bygg"
          git config user.email "fitchi-bygg@users.noreply.github.com"
          tail -n 250 bygg.log > /tmp/bygg.log || true
          git checkout --orphan bygglogg
          git rm -rf --cached . > /dev/null
          cp /tmp/bygg.log bygg.log
          git add bygg.log
          git commit -m "Bygglogg ${{ github.sha }}"
          git push -f origin bygglogg

      - name: Bygg Google Play-paket (AAB) om uppladdningsnyckeln finns
        if: ${{ env.HAR_NYCKEL == 'ja' }}
        working-directory: app/android
        env:
          FITCHI_VERSION_CODE: ${{ github.run_number }}
          FITCHI_VERSION_NAME: 0.9.${{ github.run_number }}
          FITCHI_KEYSTORE_LOSEN: ${{ secrets.FITCHI_KEYSTORE_LOSEN }}
        run: |
          echo "${{ secrets.FITCHI_KEYSTORE_B64 }}" | base64 -d > /tmp/fitchi-upload.jks
          FITCHI_KEYSTORE=/tmp/fitchi-upload.jks ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../../fitchi.aab
          rm /tmp/fitchi-upload.jks

      - name: Döp om filen
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk fitchi.apk

      - name: Publicera som "Fitchi Android (senaste)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: senaste
          name: Fitchi Android (senaste)
          body: |
            Senaste testversionen av Fitchi för Android. Ladda ner **fitchi.apk** på telefonen och installera.
            Byggd från ${{ github.sha }}.
          files: |
            fitchi.apk
            fitchi.aab
          fail_on_unmatched_files: false
          make_latest: true
